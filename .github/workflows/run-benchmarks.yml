# .github/workflows/run-benchmarks.yml
name: Validate-Benchmarks

# Keeps committed weights measured on the reference machine without a human in
# the loop:
#
#   - Pull requests re-measure only benchmarks whose `#[benchmark]` definition or
#     `weights.rs` function changed (scripts/benchmark_targets.py), then commit
#     the measurement to the PR branch. PRs that change no benchmark skip the
#     Benchmarking runner entirely. A benchmark is measured once per definition:
#     after the bot's commit it is re-measured only if it changes again.
#   - The nightly run measures the full suite on the default branch and keeps
#     one `automated/benchmark-weights` PR up to date with the drifted weights.
#     This catches drift from logic changes under an unchanged benchmark, which
#     the PR selection deliberately does not track.
#   - workflow_dispatch runs the full suite on the chosen branch and commits
#     drift to it (the default branch goes through the drift PR instead).
#
# Not a required merge check. The Benchmarking job compiles PR code with a
# read-only token; only the apply job, on a GitHub-hosted runner, can push, and
# it accepts nothing but changes to pallets/*/src/weights.rs.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: run-benchmarks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DRIFT_BRANCH: automated/benchmark-weights
  BOT_SUBJECT: "chore: update benchmark weights"

jobs:
  select:
    name: select benchmarks
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.select.outputs.run }}
      targets: ${{ steps.select.outputs.targets }}
    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Select benchmarks
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            echo "$GITHUB_EVENT_NAME: full suite" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          targets=$(python3 scripts/benchmark_targets.py --base "$BASE_SHA")
          if [[ -z "$targets" ]]; then
            echo "No benchmark definition or weights.rs function changed; nothing to measure." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          { echo "### Benchmarks to measure"; echo '```'; echo "$targets"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          {
            echo "run=true"
            echo "targets<<TARGETS_EOF"
            echo "$targets"
            echo "TARGETS_EOF"
          } >> "$GITHUB_OUTPUT"

  validate-benchmarks:
    needs: select
    # Self-hosted runners never execute fork code.
    if: >-
      needs.select.outputs.run == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
    runs-on: Benchmarking
    timeout-minutes: 240
    outputs:
      patch: ${{ steps.run.outputs.patch }}
    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get update
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get install -y --no-install-recommends \
            -o Dpkg::Options::="--force-confdef" -o Dpkg::Options::="--force-confold" \
            build-essential clang curl libssl-dev llvm libudev-dev protobuf-compiler pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Shared R2 compiler cache
        uses: ./.github/actions/sccache-setup

      - name: Cache Cargo registry and git data
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: bench-${{ hashFiles('**/Cargo.lock') }}
          cache-on-failure: true
          cache-targets: false

      # The node is only the benchmark CLI host: `benchmark pallet --runtime`
      # executes the runtime WASM, and the node contributes host functions that
      # change only with node/ or the locked SDK. Reusing it skips the node's
      # LTO link; a mismatched host function would fail instantiation loudly.
      - name: Restore benchmark node
        id: node
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .bench-node
          key: benchmark-node-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'node/**') }}

      - name: Build runtime and weight tools
        env:
          NODE_CACHED: ${{ steps.node.outputs.cache-hit }}
        run: |
          set -euo pipefail
          if [[ "$NODE_CACHED" == "true" ]]; then
            # `check` still runs the runtime build script, which compiles the
            # production WASM; it only skips codegen for the native crate.
            cargo check --locked --profile production -p node-subtensor-runtime --features runtime-benchmarks
          else
            cargo build --locked --profile production -p node-subtensor --features runtime-benchmarks
            mkdir -p .bench-node
            cp target/production/node-subtensor .bench-node/node-subtensor
          fi
          cargo build --locked --profile production -p subtensor-weight-tools --bin weight-compare

      - name: Measure
        id: run
        timeout-minutes: 180
        env:
          BENCHMARK_TARGETS: ${{ needs.select.outputs.targets }}
          NODE_BIN: ${{ github.workspace }}/.bench-node/node-subtensor
        run: |
          set -euo pipefail
          rc=0
          scripts/benchmark_action.sh || rc=$?
          { echo '```'; cat .bench_patch/summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true
          case "$rc" in
            0) echo "patch=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "patch=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$rc" ;;
          esac

      - name: Upload weights patch
        if: steps.run.outputs.patch == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bench-patch
          path: .bench_patch/
          if-no-files-found: error

  apply:
    name: commit measured weights
    needs: validate-benchmarks
    if: needs.validate-benchmarks.outputs.patch == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # The ai-review App's pushes trigger workflows (GITHUB_TOKEN pushes do
      # not), so CI runs on the commit and the benchmark selection sees it.
      - name: Mint GitHub App token
        id: app-token
        if: vars.AI_REVIEW_APP_ID != ''
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.AI_REVIEW_APP_ID }}
          private-key: ${{ secrets.AI_REVIEW_APP_PRIVATE_KEY }}

      - name: Download weights patch
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bench-patch
          path: bench-patch

      - name: Check patch only touches weights files
        run: |
          set -euo pipefail
          patch=bench-patch/benchmark_patch.diff
          test -s "$patch"
          if grep -nE '^(new file mode|deleted file mode|old mode|new mode|rename |copy |similarity index|GIT binary patch|Binary files)' "$patch"; then
            echo "::error::weights patch contains file mode, rename, or binary changes"
            exit 1
          fi
          grep -E '^diff --git ' "$patch" | while read -r _ _ a b; do
            if [[ "$a" != "a/${b#b/}" || ! "${b#b/}" =~ ^pallets/[A-Za-z0-9_-]+/src/weights\.rs$ ]]; then
              echo "::error::weights patch touches $a -> $b"
              exit 1
            fi
          done

      - name: Commit and push
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            push_branch=$PR_BRANCH
          elif [[ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            push_branch=$GITHUB_REF_NAME
          else
            push_branch=$DRIFT_BRANCH
          fi
          remote="https://github.com/$REPO.git"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 --wrap=0)"
          echo "::add-mask::$auth"
          git_auth() { git -c "http.https://github.com/.extraheader=$auth" "$@"; }

          if [[ "$push_branch" != "$DRIFT_BRANCH" ]]; then
            current=$(git_auth ls-remote "$remote" "refs/heads/$push_branch" | cut -f1)
            if [[ "$current" != "$EXPECTED_SHA" ]]; then
              echo "::warning::$push_branch moved past the measured commit; the run for the new head measures again."
              exit 0
            fi
          fi

          git init --quiet work
          cd work
          git_auth fetch --quiet --depth=1 "$remote" "$EXPECTED_SHA"
          git checkout --quiet FETCH_HEAD
          git apply --index ../bench-patch/benchmark_patch.diff
          # The subject is how scripts/benchmark_targets.py recognises measured weights.
          git -c user.name='subtensor-benchmark-bot' \
              -c user.email='subtensor-benchmark-bot@users.noreply.github.com' \
              -c core.hooksPath=/dev/null \
              commit --quiet -m "$BOT_SUBJECT" -m "Measured on the Benchmarking runner: $RUN_URL" \
              -m "$(cat ../bench-patch/summary.txt)"

          if [[ "$push_branch" == "$DRIFT_BRANCH" ]]; then
            git_auth push --quiet --force "$remote" "HEAD:refs/heads/$DRIFT_BRANCH"
            body=$(printf 'Nightly full-suite measurement found weights that drifted from the committed values.\n\nRun: %s\n\n```\n%s\n```\n' "$RUN_URL" "$(cat ../bench-patch/summary.txt)")
            if [[ -n "$(gh pr list --repo "$REPO" --head "$DRIFT_BRANCH" --state open --json number --jq '.[].number')" ]]; then
              gh pr edit "$DRIFT_BRANCH" --repo "$REPO" --body "$body"
            else
              gh pr create --repo "$REPO" --base "$DEFAULT_BRANCH" --head "$DRIFT_BRANCH" \
                --title "Update drifted benchmark weights" --body "$body"
            fi
          else
            # Not forced: if the branch moved since the check above, the push is rejected.
            git_auth push --quiet "$remote" "HEAD:refs/heads/$push_branch"
          fi
